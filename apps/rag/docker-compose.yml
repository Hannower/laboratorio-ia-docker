services:
  # Servidor Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DOCUMENTS_DIR=/data/documentos
    volumes:
      # Monta a pasta de documentos compartilhada do laboratório
      - ../../dados/documentos:/data/documentos
      # Garante a persistência dos uploads e da base vetorial local em JSON
      - ./data:/app/data
    restart: always

  # Servidor Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always