name: laboratorio-ia-docker

services:
  n8n:
    image: n8nio/n8n:2.44.5
    container_name: laboratorio-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      # Local File Trigger liberado para o exercício; Execute Command permanece bloqueado.
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand"]'
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dados/documentos:/data/documentos
    networks:
      - aula

  rag-backend:
    build:
      context: ./apps/rag
      dockerfile: backend/Dockerfile
    container_name: laboratorio-rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./apps/rag/.env
        required: false
    environment:
      - DOCUMENTS_DIR=/data/documentos
    volumes:
      - ./dados/documentos:/data/documentos
      - ./apps/rag/data:/app/data
    networks:
      - aula

  rag-frontend:
    build:
      context: ./apps/rag/frontend
      dockerfile: Dockerfile
    container_name: laboratorio-rag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - rag-backend
    networks:
      - aula

  mcp:
    build:
      context: ./apps/mcp
      dockerfile: Dockerfile
    container_name: laboratorio-mcp
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - path: ./apps/mcp/.env
        required: false
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
    networks:
      - aula

volumes:
  n8n_data:

networks:
  aula:
    name: laboratorio-ia-aula
